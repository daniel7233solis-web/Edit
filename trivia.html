<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT | Teoría y Trivia</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <a href="index.html" class="logo">EDIT</a>

        <nav class="navegacion" aria-label="Navegación principal">
            <a href="index.html">Novedades</a>
            <a href="personaje.html">Crear personaje</a>
            <a href="escenario.html">Jugar</a>
            <a href="ayuda.html">Información y ayuda</a>
        </nav>
    </header>

    <main class="contenido-principal">

        <section class="trivia">

            <h1>Teoría y Trivia</h1>
            <p>¡Poné a prueba tus conocimientos!</p>


            <div class="trivia-juego">

                <div class="trivia-contenido">

                    <div class="trivia-preguntas">

                        <p id="progreso">Pregunta 1 de 5</p>

                        <h2 id="pregunta">
                            ¿Qué significa RGB en diseño digital?
                        </h2>

                        <div id="opciones-trivia">
                            <button type="button">Rojo, verde y azul</button>
                            <button type="button">Rojo, gris y blanco</button>
                            <button type="button">Rosa, gris y beige</button>
                            <button type="button">Rojo, verde y negro</button>
                        </div>

                        <p id="resultado" role="status"></p>

                        <button type="button" id="siguiente">
                            Siguiente pregunta
                        </button>

                    </div>

                    <div class="trivia-mishi">
                        <div id="lienzo-trivia"></div>
                    </div>

                </div>

            </div>


        </section>

    </main>

    <script src="lib/p5.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/mascota.js"></script>

    <script>
        let sorpresaHasta = 0;
        function preload() {
            preloadMascota();
        }

        function setup() {
            cargarMascota();

            const lienzo = createCanvas(ANCHO, ALTO);
            lienzo.parent('lienzo-trivia');

            pixelDensity(1);
            angleMode(RADIANS);
        }


        function draw() {
            clear();

            push();

            if (millis() < sorpresaHasta) {
                const movimiento = sin(frameCount * 0.8) * 12;
                translate(movimiento, 0);
            }

            dibujarMascota();
            dibujarPantaloncito();

            pop();
        }

    </script>

    <script src="js/trivia.js"></script>

</body>

</html>
